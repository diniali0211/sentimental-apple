<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | Sentimental Apple</title>
  <meta name="description" content="Browse stickers, notebooks, postcards, prints and journalling goodies.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;600;700;800;900&family=Shrikhand&family=Reenie+Beanie&family=Great+Vibes&family=Abril+Fatface&family=Hanken+Grotesk:wght@400;600;800&family=Bodoni+Moda:ital@1&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/shop.css">
  <link rel="stylesheet" href="css/themes.css">
  <script src="js/theme.js"></script>
</head>
<body data-page="shop">
<main id="main" class="sp">
  <section class="sp-hero">
    <div class="sp-wrap sp-hero__in">
      <div>
        <nav class="sp-crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <span data-crumb></span></nav>
        <h1 data-title>The whole shop</h1>
        <p data-intro></p>
      </div>
      <div class="sp-col" data-col hidden></div>
    </div>
  </section>

  <div class="sp-wrap">
    <div class="sp-cats" data-cats role="group" aria-label="Categories"></div>

    <div class="sp-bar">
      <span class="sp-count" data-count></span>
      <div class="sp-tools">
        <label class="sr-only" for="search">Search the shop</label>
        <input class="sp-field" id="search" type="search" placeholder="Search stickers, notebooks…" data-search>
        <label class="sr-only" for="sort">Sort by</label>
        <select class="sp-field" id="sort" data-sort>
          <option value="featured">Featured</option>
          <option value="new">Newest first</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
        </select>
      </div>
    </div>

    <div class="sp-grid" data-grid></div>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/home.js"></script>
<script src="js/shop.js"></script>
<script src="js/app.js"></script>
</body>
</html>
